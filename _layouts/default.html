<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="icon" href="{{ '/assets/pomograph.svg' | relative_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/assets/styles.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}">Pomograph</a>
      <nav class="nav" aria-label="主要ページ">
        <a href="{{ '/support/' | relative_url }}">サポート</a>
        <a href="{{ '/privacy/' | relative_url }}">プライバシー</a>
        <a href="{{ '/terms/' | relative_url }}">利用規約</a>
      </nav>
    </header>
    <main class="page">{{ content }}</main>
    <footer class="site-footer">
      <a href="{{ '/licenses/' | relative_url }}">ライセンス</a>
      <a href="https://pomograph.ebiapps.com/">Web版を開く</a>
      <span>© 2026 Ebi Apps</span>
    </footer>
  </body>
</html>
